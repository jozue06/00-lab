<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493"/><stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="apex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6BB5"/><stop offset="50%" stop-color="#C850FF"/><stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="220" fill="#000"/>
  <!-- mini emblem -->
  <g transform="translate(110,110)">
    <polygon points="0,-88 78,-48 78,48 0,88 -78,48 -78,-48" fill="none" stroke="url(#g)" stroke-width="3" filter="url(#gl)"/>
    <circle cx="0" cy="-15" r="28" fill="none" stroke="url(#g)" stroke-width="1.2" opacity="0.6"/>
    <rect x="-22" y="5" width="44" height="55" rx="10" fill="none" stroke="url(#g)" stroke-width="1.5"/>
    <polyline points="-50,25 -30,5 -15,20" fill="none" stroke="#FF1493" stroke-width="1.3"/>
    <polyline points="15,20 30,5 50,25" fill="none" stroke="#00E5FF" stroke-width="1.3"/>
  </g>
  <text x="230" y="108" font-family="Poppins,Impact,sans-serif" font-size="88" font-weight="900" font-style="italic" fill="url(#apex)" stroke="#150828" stroke-width="2" filter="url(#gl)">APEX</text>
  <text x="232" y="162" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="14" fill="url(#g)">DETAILING</text>
</svg>
